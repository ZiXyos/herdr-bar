name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # No `cargo fmt --check` yet: the port is not rustfmt-clean, and
      # reformatting it is a separate change from wiring up CI.
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      # Besides the unit tests, this replays the Python release's recorded
      # answers (src/probe.rs) and, on Linux and macOS, drives the binary on a
      # pty against a fake Herdr and compares every screen with the transcripts
      # recorded from the Python release (tests/parity.rs).
      - name: Tests
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked

  # Cargo.toml's rust-version: the oldest toolchain a source install
  # (scripts/install.sh's cargo fallback) is promised to work with.
  msrv:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Build
        run: cargo build --locked
      - name: Tests
        run: cargo test --locked
